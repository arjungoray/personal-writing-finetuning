[project]
name = "voice-lab-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=5.1.0,<6",
  "python-docx>=1.1.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.4,<9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["datasets", "extraction", "judge_cache", "rewards", "scorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
